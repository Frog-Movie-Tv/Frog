<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Player</title>

		<script src="/player.js"></script>
	</head>
	<body>
		<frog-player></frog-player>
		<script>
			customElements.define(
				'frog-player',
				class extends HTMLElement {
					connectedCallback() {
						const root = this.attachShadow({ mode: 'open' });
						root.innerHTML =
							'<div><video width="640" height="360" playsinline muted src="/media/episode.webm"></video></div>';
					}
				}
			);
		</script>
	</body>
</html>
