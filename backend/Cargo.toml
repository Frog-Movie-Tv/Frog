[package]
name = "frog"
version = "0.4.5" # x-release-please-version
edition = "2021"
rust-version = "1.82"
description = "Frog — a self-hosted personal cinema: movie & TV tracking"
license = "MIT"
publish = false

[dependencies]
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
urlencoding = "2"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Already in the tree through rustls; used directly for Web Push encryption.
ring = "0.17"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
