name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ['bug']
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Frog did instead of what you expected.
      placeholder: I ticked the last episode of a season and the show stayed on Watching.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown on the About page.
      placeholder: 0.4.1
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop browser
        - Phone browser
        - Installed on a phone home screen
        - Docker
        - Local development
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Anything in the logs or the browser console
      description: Paste what is relevant. Check it for your TMDB key first.
      render: text
