name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Formatting
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      # Includes the guard that every query touching personal data names its
      # owner, and the tests that prove accounts cannot read each other.
      - name: Tests
        working-directory: backend
        run: cargo test --locked

  frontend:
    name: SvelteKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Formatting
        working-directory: frontend
        run: npm run format:check

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Build
        working-directory: frontend
        run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The previous release tag is needed to build last version's database.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build
        working-directory: backend
        run: cargo build --locked

      # A fresh database, and a database created by the previous release and
      # then upgraded. The second one is what every existing install does.
      - name: Apply on a fresh database and on the previous version's
        run: bash backend/scripts/check-migrations.sh

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The suite drives the real binary against an empty database and no TMDB
      # key, so it never touches the network.
      - name: Build backend
        working-directory: backend
        run: cargo build --locked

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pull requests build amd64 only, to keep a review quick. main and tags
      # build both architectures, because the server is an Ampere ARM machine.
      - name: Decide platforms
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to GHCR
        if: steps.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :main follows the branch, which staging tracks. A tag also gets its
      # own version tags and :latest, which production follows.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.plan.outputs.platforms }}
          push: ${{ steps.plan.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the thing that was just built actually serves traffic, on the
      # same image CI produced rather than a rebuild.
      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --load -t frog:ci --platform linux/amd64 .
          docker run -d --name frog-ci -p 8080:8080 frog:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "healthz answered"
              curl -fsS http://127.0.0.1:8080/healthz
              docker rm -f frog-ci
              exit 0
            fi
            sleep 2
          done
          echo "the image never became healthy"
          docker logs frog-ci
          docker rm -f frog-ci
          exit 1

      # FROG_NOTIFY_HOUR is local time, so TZ has to mean something in there.
      - name: The image knows the owners' time zone
        if: github.event_name == 'pull_request'
        run: |
          zone="$(docker run --rm -e TZ=Europe/Brussels --entrypoint date frog:ci +%Z)"
          echo "Europe/Brussels reads as $zone"
          case "$zone" in
            CET|CEST) ;;
            *) echo "the image has no time zone data"; exit 1 ;;
          esac
