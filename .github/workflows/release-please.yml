name: Release

# release-please keeps a pull request open that bumps the version and writes
# CHANGELOG.md from the Conventional Commit messages on main. Merging that pull
# request tags the release, which is what production follows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps backend/Cargo.toml but leaves Cargo.lock pinning
      # the previous version, so the release pull request fails its own CI on
      # cargo --locked. Put the lock right on the branch it just wrote.
      - name: Check out the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.pr }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: 22

      # The release check refuses a version with nothing to say for itself on
      # the What's new page. Notes are written with each change, so this gives
      # what is under Upcoming its version. Only with nothing there does it
      # draft from the commit messages, marked as a draft to rewrite, so the
      # release is never blocked.
      - name: Give the release its notes
        if: ${{ steps.release.outputs.pr }}
        run: node scripts/draft-release-notes.mjs

      - name: Sync Cargo.lock with the release version
        if: ${{ steps.release.outputs.pr }}
        run: |
          (cd backend && cargo fetch)
          if git diff --quiet backend/Cargo.lock RELEASE-NOTES.md; then
            echo "nothing to add to the release branch"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Cargo.lock RELEASE-NOTES.md
          git commit -m 'chore: sync the lock file and draft the release notes'
          git push

  # release-please writes the release page from CHANGELOG.md, which is a list
  # of commit subjects. That is the page anyone following a link lands on, so
  # it carries the notes written for people instead.
  notes:
    name: Put the written notes on the release
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node scripts/release-body.mjs "$VERSION" > /tmp/body.md
          if [ -s /tmp/body.md ]; then
            gh release edit "$TAG" --notes-file /tmp/body.md
            echo "the release page now carries the written notes"
          else
            echo "nothing written for $VERSION; leaving the generated body"
          fi

  # A tag created with GITHUB_TOKEN does not start a workflow run, so the tag
  # build in CI never happens and production has no image to pull. Publish it
  # here instead, from the release release-please just made.
  #
  # Each architecture is built on a runner of that architecture. Emulating
  # arm64 to compile Rust took over an hour; native runners are free on a
  # public repository and take minutes.
  publish:
    name: Build ${{ matrix.platform }}
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the tags go on the manifest that joins them.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/frog-movie-tv/frog,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      # Without the sha256: prefix: an artifact file name cannot contain a
      # colon, and the prefix goes back on when the manifest is assembled.
      - name: Keep the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1

  # One manifest carrying both, so a pull gets the right architecture.
  manifest:
    name: Publish the release image
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join them under the release tags
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/frog-movie-tv/frog
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          docker buildx imagetools create             --tag "$IMAGE:$VERSION"             --tag "$IMAGE:latest"             $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
