name: Release

# release-please keeps a pull request open that bumps the version and writes
# CHANGELOG.md from the Conventional Commit messages on main. Merging that pull
# request tags the release, which is what production follows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps backend/Cargo.toml but leaves Cargo.lock pinning
      # the previous version, so the release pull request fails its own CI on
      # cargo --locked. Put the lock right on the branch it just wrote.
      - name: Check out the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.pr }}

      - name: Sync Cargo.lock with the release version
        if: ${{ steps.release.outputs.pr }}
        run: |
          (cd backend && cargo fetch)
          if git diff --quiet backend/Cargo.lock; then
            echo "Cargo.lock already matches"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Cargo.lock
          git commit -m 'chore: sync Cargo.lock with the released version'
          git push
