name: Release

# release-please keeps a pull request open that bumps the version and writes
# CHANGELOG.md from the Conventional Commit messages on main. Merging that pull
# request tags the release, which is what production follows.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps backend/Cargo.toml but leaves Cargo.lock pinning
      # the previous version, so the release pull request fails its own CI on
      # cargo --locked. Put the lock right on the branch it just wrote.
      - name: Check out the release branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ steps.release.outputs.pr }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: 22

      # The release check refuses a version with nothing to say for itself on
      # the What's new page, and that has stopped two releases now. Draft the
      # section from the same commit messages release-please already used, so
      # the release is never blocked; it is marked as a draft to rewrite in
      # Frog's voice before merging.
      - name: Draft the release notes if nobody has written them
        if: ${{ steps.release.outputs.pr }}
        run: node scripts/draft-release-notes.mjs

      - name: Sync Cargo.lock with the release version
        if: ${{ steps.release.outputs.pr }}
        run: |
          (cd backend && cargo fetch)
          if git diff --quiet backend/Cargo.lock RELEASE-NOTES.md; then
            echo "nothing to add to the release branch"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Cargo.lock RELEASE-NOTES.md
          git commit -m 'chore: sync the lock file and draft the release notes'
          git push

  # A tag created with GITHUB_TOKEN does not start a workflow run, so the tag
  # build in CI never happens and production has no image to pull. Publish it
  # here instead, from the release release-please just made.
  publish:
    name: Publish the release image
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Lower case on purpose: a registry refuses a capital letter in a
          # repository name, and the organisation has them.
          tags: |
            ghcr.io/frog-movie-tv/frog:${{ needs.release-please.outputs.version }}
            ghcr.io/frog-movie-tv/frog:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
